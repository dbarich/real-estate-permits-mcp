[project]
name = "real-estate-permits-mcp"
version = "0.2.3-alpha"
description = "MCP server for Seattle building permits and King County property data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Devin Barich", email = "devin.barich@gmail.com"},
]
keywords = ["mcp", "real-estate", "seattle", "building-permits", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

dependencies = [
    "mcp",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/dbarich/real-estate-permits-mcp"
Issues = "https://github.com/dbarich/real-estate-permits-mcp/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
